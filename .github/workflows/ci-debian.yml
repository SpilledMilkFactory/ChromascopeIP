# M1.5: I verify Debian 12 and Debian 13 in their own AMD64 containers.
# This workflow compiles the GUI; it does not launch a graphical session.
name: Debian CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debian-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: ${{ matrix.distribution }} / Release / CTest
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: debian-12
            version: '12'
            codename: bookworm
            image_revision: '20261104'
            image: debian:bookworm@sha256:366a6da5efcceffbaa19c560a101b97b87a1a9664eeeac8bc3d24395ddbf14f3
          - distribution: debian-13
            version: '13'
            codename: trixie
            image_revision: '20261104'
            image: debian:trixie@sha256:bfc36aecdece0387418759dba474aa856c026ca8087da3606b41b90ab0509c99

    container:
      image: ${{ matrix.image }}

    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive
      OPENCV_EXPECTED_COMMIT: e4f78fbcf1a773fbed69e14500e8b734963eb585
      OPENCV_BUILD_JOBS: '2'

    steps:
      # Official Debian images are minimal: git is needed BEFORE checkout;
      # tar and zstd are needed by actions/cache inside the container.
      - name: Validate Debian image and install CI prerequisites
        run: |
          set -Eeuo pipefail
          source /etc/os-release
          test "$ID" = debian
          test "$VERSION_ID" = '${{ matrix.version }}'
          test "$(dpkg --print-architecture)" = amd64
          printf 'Debian %s (%s), architecture %s\n' "$VERSION_ID" "$VERSION_CODENAME" "$(dpkg --print-architecture)"
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git tar zstd \
            build-essential cmake ninja-build pkg-config python3 \
            dpkg-dev patchelf debootstrap \
            libjpeg-dev libpng-dev libtiff-dev libwebp-dev \
            libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            libglfw3-dev libgl1-mesa-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
          cmake --version
          ninja --version
          c++ --version | sed -n '1p'

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore isolated OpenCV 5.1.0 installation
        id: opencv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/opt/opencv-5.1.0
          # A new base image digest requires a new image_revision and cache key.
          key: opencv-5.1.0-${{ matrix.distribution }}-${{ runner.arch }}-image-${{ matrix.image_revision }}-${{ hashFiles('scripts/bootstrap_opencv_ubuntu_26_04.sh', 'scripts/verify_opencv_linux_videoio.sh', 'tests/quality/opencv_videoio_consumer/CMakeLists.txt', 'tests/integration/test_videoio_backend.cpp', 'tests/quality/opencv_videoio_consumer/dnn_probe.cpp') }}-m5-2-dnn-v1

      - name: Build isolated OpenCV 5.1.0 on cache miss
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          ./scripts/bootstrap_opencv_ubuntu_26_04.sh

      - name: Verify OpenCV source revision and CMake package
        run: |
          set -Eeuo pipefail
          prefix="$HOME/.local/opt/opencv-5.1.0"
          test -f "$prefix/.chromascope-opencv-source-revision"
          test "$(cat "$prefix/.chromascope-opencv-source-revision")" = "$OPENCV_EXPECTED_COMMIT"
          test -f "$prefix/lib/cmake/opencv5/OpenCVConfig.cmake"
          marker="$prefix/.chromascope-opencv-videoio-build.txt"
          test -f "$marker"
          grep -Fxq 'modules=core,imgproc,imgcodecs,videoio,dnn' "$marker"
          grep -Fxq 'video_backend=ffmpeg' "$marker"
          grep -Fxq 'consumer_probe=PASS' "$marker"
          ./scripts/verify_opencv_linux_videoio.sh "$prefix" "${RUNNER_TEMP:-/tmp}/chromascope-opencv-m41-consumer"
          printf 'OpenCV source commit: %s\n' "$(cat "$prefix/.chromascope-opencv-source-revision")"

      - name: Configure Release (GUI, CLI, tests)
        run: |
          # Both Debian packaging targets require GNU multiarch /usr layout.
          cmake --preset linux-release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=lib/x86_64-linux-gnu

      - name: Build Release (GUI and CLI)
        run: cmake --build --preset linux-release --parallel 2

      - name: Run all Release CTests
        run: ctest --preset linux-release --parallel 2

      - name: Configure CLI-only Release
        run: cmake --preset linux-cli-release

      - name: Build CLI-only Release
        run: cmake --build --preset linux-cli-release --parallel 2

      - name: Run all CLI-only CTests
        run: ctest --preset linux-cli-release --parallel 2

      - name: Build Debian 12 AMD64 candidate package
        if: matrix.version == '12'
        run: |
          set -Eeuo pipefail
          python3 scripts/package_debian12.py --build \
            --build-dir build/presets/linux-release \
            --opencv-prefix "$HOME/.local/opt/opencv-5.1.0" \
            --output-dir build/packages
          python3 scripts/package_debian12.py --inspect \
            build/packages/ChromascopeIP-0.1.3-Debian12-amd64.deb

      - name: Smoke-test clean Debian 12 installation
        if: matrix.version == '12'
        run: |
          set -Eeuo pipefail
          bash scripts/smoke_debian12_chroot.sh \
            build/packages/ChromascopeIP-0.1.3-Debian12-amd64.deb

      # M11.3: Trixie package uses its own build, dependency and runtime checks.
      # Never repackage the Bookworm binary or reuse Debian 12 dependency metadata.
      - name: Build Debian 13 AMD64 candidate package
        if: matrix.version == '13'
        run: |
          set -Eeuo pipefail
          python3 scripts/package_debian13.py --build \
            --build-dir build/presets/linux-release \
            --opencv-prefix "$HOME/.local/opt/opencv-5.1.0" \
            --output-dir build/packages
          python3 scripts/package_debian13.py --inspect \
            build/packages/ChromascopeIP-0.1.3-Debian13-amd64.deb

      - name: Smoke-test clean Debian 13 installation
        if: matrix.version == '13'
        run: |
          set -Eeuo pipefail
          bash scripts/smoke_debian13_chroot.sh \
            build/packages/ChromascopeIP-0.1.3-Debian13-amd64.deb

      # A package is an approved *development candidate* only after smoke passes.
      - name: Upload tested Debian 13 candidate package
        if: matrix.version == '13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ChromascopeIP-0.1.3-Debian13-amd64
          path: build/packages/ChromascopeIP-0.1.3-Debian13-amd64.deb
          archive: false
          if-no-files-found: error
          retention-days: 7

      # A failed build is never uploaded using the qualified artifact name.
      - name: Upload UNQUALIFIED Debian 13 package for failure diagnosis
        if: failure() && matrix.version == '13'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UNQUALIFIED-M11.3-Debian13-amd64-diagnostics
          path: build/packages/ChromascopeIP-0.1.3-Debian13-amd64.deb
          archive: false
          if-no-files-found: ignore
          retention-days: 2

      # This M11.2 candidate is for testing, NOT a signed v1.0 release.
      - name: Upload tested Debian 12 candidate package
        if: matrix.version == '12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          path: build/packages/ChromascopeIP-0.1.3-Debian12-amd64.deb
          archive: false
          if-no-files-found: error
          retention-days: 7

      # Keep a failed candidate available for binary/ELF investigation.
      # This is explicitly UNQUALIFIED and never a release artifact; it cannot
      # satisfy the successful-smoke upload gate above.
      - name: Upload UNQUALIFIED Debian 12 package for failure diagnosis
        if: failure() && matrix.version == '12'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UNQUALIFIED-M11.2-Debian12-amd64-diagnostics
          path: build/packages/ChromascopeIP-0.1.3-Debian12-amd64.deb
          archive: false
          if-no-files-found: ignore
          retention-days: 2

      - name: Show test logs on failure
        if: failure()
        run: |
          if [[ -d build/presets ]]; then
            find build/presets -type f -path '*/Testing/Temporary/LastTest.log' \
              -print -exec tail -n 100 {} \;
          fi

      - name: Summarize verified scope
        if: success()
        run: |
          {
            echo '## ChromascopeIP M11.3 Debian CI'
            echo '- Distribution: Debian ${{ matrix.version }} (${{ matrix.codename }}), AMD64'
            echo '- Container base: ${{ matrix.image_revision }} (pinned image digest)'
            echo '- OpenCV: 5.1.0 (source revision marker verified)'
            echo '- GUI + CLI: compiled in Release configuration'
            echo '- GUI-enabled Release: complete CTest suite passed'
            echo '- CLI-only Release: complete CTest suite passed'
            if [[ '${{ matrix.version }}' == '12' ]]; then
              echo '- Debian 12: .deb build, dependency resolution and isolated clean-install CLI smoke PASSED'
            else
              echo '- Debian 13: .deb build, dependency resolution and isolated clean-install CLI smoke PASSED'
            fi
            echo '- Manual GUI and hardware-camera sign-off remains pending'
          } >> "$GITHUB_STEP_SUMMARY"
