# M1.5: I verify Debian 12 and Debian 13 in their own AMD64 containers.
# This workflow compiles the GUI; it does not launch a graphical session.
name: Debian CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: debian-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: ${{ matrix.distribution }} / Release / CTest
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: debian-12
            version: '12'
            codename: bookworm
            image_revision: '20261104'
            image: debian:bookworm@sha256:366a6da5efcceffbaa19c560a101b97b87a1a9664eeeac8bc3d24395ddbf14f3
          - distribution: debian-13
            version: '13'
            codename: trixie
            image_revision: '20261104'
            image: debian:trixie@sha256:bfc36aecdece0387418759dba474aa856c026ca8087da3606b41b90ab0509c99

    container:
      image: ${{ matrix.image }}

    defaults:
      run:
        shell: bash

    env:
      DEBIAN_FRONTEND: noninteractive
      OPENCV_EXPECTED_COMMIT: e4f78fbcf1a773fbed69e14500e8b734963eb585
      OPENCV_BUILD_JOBS: '2'

    steps:
      # Official Debian images are minimal: git is needed BEFORE checkout;
      # tar and zstd are needed by actions/cache inside the container.
      - name: Validate Debian image and install CI prerequisites
        run: |
          set -Eeuo pipefail
          source /etc/os-release
          test "$ID" = debian
          test "$VERSION_ID" = '${{ matrix.version }}'
          test "$(dpkg --print-architecture)" = amd64
          printf 'Debian %s (%s), architecture %s\n' "$VERSION_ID" "$VERSION_CODENAME" "$(dpkg --print-architecture)"
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates git tar zstd \
            build-essential cmake ninja-build pkg-config python3 \
            libjpeg-dev libpng-dev libtiff-dev libwebp-dev \
            libglfw3-dev libgl1-mesa-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
          cmake --version
          ninja --version
          c++ --version | sed -n '1p'

      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Restore isolated OpenCV 5.1.0 installation
        id: opencv-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.local/opt/opencv-5.1.0
          # A new base image digest requires a new image_revision and cache key.
          key: opencv-5.1.0-${{ matrix.distribution }}-${{ runner.arch }}-image-${{ matrix.image_revision }}-${{ hashFiles('scripts/bootstrap_opencv_ubuntu_26_04.sh') }}-v1

      - name: Build isolated OpenCV 5.1.0 on cache miss
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: |
          set -Eeuo pipefail
          ./scripts/bootstrap_opencv_ubuntu_26_04.sh

      - name: Verify OpenCV source revision and CMake package
        run: |
          set -Eeuo pipefail
          prefix="$HOME/.local/opt/opencv-5.1.0"
          test -f "$prefix/.chromascope-opencv-source-revision"
          test "$(cat "$prefix/.chromascope-opencv-source-revision")" = "$OPENCV_EXPECTED_COMMIT"
          test -f "$prefix/lib/cmake/opencv5/OpenCVConfig.cmake"
          printf 'OpenCV source commit: %s\n' "$(cat "$prefix/.chromascope-opencv-source-revision")"

      - name: Configure Release (GUI, CLI, tests)
        run: cmake --preset linux-release

      - name: Build Release (GUI and CLI)
        run: cmake --build --preset linux-release --parallel 2

      - name: Run all Release CTests
        run: ctest --preset linux-release --parallel 2

      - name: Configure CLI-only Release
        run: cmake --preset linux-cli-release

      - name: Build CLI-only Release
        run: cmake --build --preset linux-cli-release --parallel 2

      - name: Run all CLI-only CTests
        run: ctest --preset linux-cli-release --parallel 2

      - name: Show test logs on failure
        if: failure()
        run: |
          if [[ -d build/presets ]]; then
            find build/presets -type f -path '*/Testing/Temporary/LastTest.log' \
              -print -exec tail -n 100 {} \;
          fi

      - name: Summarize verified scope
        if: success()
        run: |
          {
            echo '## ChromascopeIP M1.5 Debian CI'
            echo '- Distribution: Debian ${{ matrix.version }} (${{ matrix.codename }}), AMD64'
            echo '- Container base: ${{ matrix.image_revision }} (pinned image digest)'
            echo '- OpenCV: 5.1.0 (source revision marker verified)'
            echo '- GUI + CLI: compiled in Release configuration'
            echo '- GUI-enabled Release: complete CTest suite passed'
            echo '- CLI-only Release: complete CTest suite passed'
            echo '- GUI launch, hardware cameras, .deb package installation: not tested'
          } >> "$GITHUB_STEP_SUMMARY"
