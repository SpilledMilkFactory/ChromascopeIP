# M1.4: I verify native Ubuntu builds before accepting a pull request.
# Hardware-dependent GUI interaction and webcam tests are outside this CI gate.
name: Ubuntu CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      legacy_packages:
        description: 'Also build and smoke-test the historical v1.0.0 packages'
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      legacy_packages:
        description: 'Run historical v1.0.0 packaging steps for legacy matrix callers'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ubuntu-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    name: ${{ matrix.os }} / Release / CTest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-26.04]

    env:
      OPENCV_EXPECTED_COMMIT: e4f78fbcf1a773fbed69e14500e8b734963eb585
      OPENCV_BUILD_JOBS: '2'
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install build prerequisites
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config \
            libjpeg-dev libpng-dev libtiff-dev libwebp-dev \
            libcurl4-openssl-dev libavcodec-dev libavformat-dev libavutil-dev libswscale-dev libswresample-dev \
            libglfw3-dev libgl1-mesa-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev
          cmake --version
          ninja --version
          c++ --version | head -n 1

      # M11.4-only package tools: keep the 26.04 job's prerequisites unchanged.
      - name: Install Ubuntu 24.04 packaging prerequisites
        if: ${{ inputs.legacy_packages == true && matrix.os == 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev patchelf binutils debootstrap ubuntu-keyring

      # M11.5: independent native Resolute packaging tools.
      - name: Install Ubuntu 26.04 packaging prerequisites
        if: ${{ inputs.legacy_packages == true && matrix.os == 'ubuntu-26.04' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get install -y --no-install-recommends \
            dpkg-dev patchelf binutils debootstrap ubuntu-keyring

      - name: Restore isolated OpenCV 5.1.0 installation
        id: opencv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/opt/opencv-5.1.0
          key: opencv-5.1.0-${{ matrix.os }}-${{ runner.arch }}-${{ hashFiles('scripts/apply_opencv_security_patch.py', 'scripts/opencv_linux_patches/disable-magicyuv.patch', 'scripts/opencv_linux_patches/ffmpeg-final-policy.patch', 'tests/integration/test_magicyuv_policy.cpp', 'tests/fixtures/magicyuv.avi.hex', 'tests/fixtures/cfhd.avi.hex', 'scripts/bootstrap_opencv_ubuntu_26_04.sh', 'scripts/verify_opencv_linux_videoio.sh', 'tests/quality/opencv_videoio_consumer/CMakeLists.txt', 'tests/integration/test_videoio_backend.cpp', 'tests/quality/opencv_videoio_consumer/dnn_probe.cpp') }}-m5-2-dnn-v1

      - name: Build isolated OpenCV 5.1.0 on cache miss
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -Eeuo pipefail
          ./scripts/bootstrap_opencv_ubuntu_26_04.sh

      - name: Verify OpenCV provenance and CMake package
        shell: bash
        run: |
          set -Eeuo pipefail
          prefix="$HOME/.local/opt/opencv-5.1.0"
          test -f "$prefix/.chromascope-opencv-source-revision"
          test "$(cat "$prefix/.chromascope-opencv-source-revision")" = "$OPENCV_EXPECTED_COMMIT"
          test -f "$prefix/lib/cmake/opencv5/OpenCVConfig.cmake"
          marker="$prefix/.chromascope-opencv-videoio-build.txt"
          test -f "$marker"
          grep -Fxq 'modules=core,imgproc,imgcodecs,videoio,dnn' "$marker"
          grep -Fxq 'video_backend=ffmpeg' "$marker"
          grep -Fxq 'consumer_probe=PASS' "$marker"
          grep -Fxq 'magicyuv_policy=disabled-before-probe-and-playback' "$marker"
          grep -Fxq 'security_patch_sha256=2c33a69b0e5c26d8e28dfee22daa1ae2c78cba4732de4c692ff729e8e4a7fb2d' "$marker"
          grep -Fxq 'ffmpeg_parser_policy=noparse-from-preopen' "$marker"
          grep -Fxq 'lcevc_policy=reject-enabled-runtime' "$marker"
          grep -Fxq 'hwdec_policy=cpu-only' "$marker"
          grep -Fxq 'security_final_patch_sha256=dfdb49ab2c57d0281afc4596597397f138fdd183353dc4c9942810318019935a' "$marker"
          ./scripts/verify_opencv_linux_videoio.sh "$prefix" "$RUNNER_TEMP/chromascope-opencv-m41-consumer"
          printf 'OpenCV source commit: %s\n' "$(cat "$prefix/.chromascope-opencv-source-revision")"

      - name: Configure Release (GUI, CLI, tests)
        run: |
          # M11.4/M11.5: both native .deb targets require /usr multiarch.
          cmake --preset linux-release \
            -DCMAKE_INSTALL_PREFIX=/usr \
            -DCMAKE_INSTALL_LIBDIR=lib/x86_64-linux-gnu

      - name: Build Release (GUI and CLI)
        run: cmake --build --preset linux-release --parallel 2

      - name: Run all Release CTests
        run: ctest --preset linux-release --parallel 2

      - name: Verify CLI-only configuration
        run: cmake --preset linux-cli-release

      - name: Build CLI-only configuration
        run: cmake --build --preset linux-cli-release --parallel 2

      - name: Run all CLI-only CTests
        run: ctest --preset linux-cli-release --parallel 2

      # M11.4: package only the native Noble binary. Never repackage the
      # Debian builds or 26.04 binary: ABI and apt dependencies are OS-specific.
      - name: Build Ubuntu 24.04 AMD64 candidate package
        if: ${{ inputs.legacy_packages == true && matrix.os == 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/package_ubuntu24.py --build \
            --build-dir build/presets/linux-release \
            --opencv-prefix "$HOME/.local/opt/opencv-5.1.0" \
            --output-dir build/packages
          python3 scripts/package_ubuntu24.py --inspect \
            build/packages/ChromascopeIP-1.0.0-Ubuntu24.04-amd64.deb

      - name: Smoke-test clean Ubuntu 24.04 installation
        if: ${{ inputs.legacy_packages == true && matrix.os == 'ubuntu-24.04' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo bash scripts/smoke_ubuntu24_chroot.sh \
            build/packages/ChromascopeIP-1.0.0-Ubuntu24.04-amd64.deb

      # A development package qualifies only after the Noble smoke succeeds.
      - name: Upload tested Ubuntu 24.04 candidate package
        if: ${{ inputs.legacy_packages == true && matrix.os == 'ubuntu-24.04' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ChromascopeIP-1.0.0-Ubuntu24.04-amd64.deb
          path: build/packages/ChromascopeIP-1.0.0-Ubuntu24.04-amd64.deb
          archive: false
          if-no-files-found: error
          retention-days: 7

      # Keep failed binaries separate: they are unqualified diagnostics only.
      - name: Upload UNQUALIFIED Ubuntu 24.04 package for failure diagnosis
        if: ${{ failure() && inputs.legacy_packages == true && matrix.os == 'ubuntu-24.04' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UNQUALIFIED-M11.4-Ubuntu24.04-amd64-diagnostics
          path: build/packages/ChromascopeIP-1.0.0-Ubuntu24.04-amd64.deb
          # Diagnostic artifacts MUST retain their UNQUALIFIED name:
          # archive:false would silently rename to the raw package filename.
          archive: true
          if-no-files-found: ignore
          retention-days: 2

      # M11.5: package only the native Resolute binary; no Noble/Debian reuse.
      - name: Build Ubuntu 26.04 AMD64 candidate package
        if: ${{ inputs.legacy_packages == true && matrix.os == 'ubuntu-26.04' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python3 scripts/package_ubuntu26.py --build \
            --build-dir build/presets/linux-release \
            --opencv-prefix "$HOME/.local/opt/opencv-5.1.0" \
            --output-dir build/packages
          python3 scripts/package_ubuntu26.py --inspect \
            build/packages/ChromascopeIP-1.0.0-Ubuntu26.04-amd64.deb

      - name: Smoke-test clean Ubuntu 26.04 installation
        if: ${{ inputs.legacy_packages == true && matrix.os == 'ubuntu-26.04' }}
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo bash scripts/smoke_ubuntu26_chroot.sh \
            build/packages/ChromascopeIP-1.0.0-Ubuntu26.04-amd64.deb

      # Only a successfully smoke-qualified Resolute package is uploaded.
      - name: Upload tested Ubuntu 26.04 candidate package
        if: ${{ inputs.legacy_packages == true && matrix.os == 'ubuntu-26.04' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ChromascopeIP-1.0.0-Ubuntu26.04-amd64.deb
          path: build/packages/ChromascopeIP-1.0.0-Ubuntu26.04-amd64.deb
          archive: false
          if-no-files-found: error
          retention-days: 7

      # Never treat failed native .deb output as a qualified distribution.
      - name: Upload UNQUALIFIED Ubuntu 26.04 package for failure diagnosis
        if: ${{ failure() && inputs.legacy_packages == true && matrix.os == 'ubuntu-26.04' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: UNQUALIFIED-M11.5-Ubuntu26.04-amd64-diagnostics
          path: build/packages/ChromascopeIP-1.0.0-Ubuntu26.04-amd64.deb
          # Diagnostic artifacts MUST retain their UNQUALIFIED name:
          # archive:false would silently rename to the raw package filename.
          archive: true
          if-no-files-found: ignore
          retention-days: 2

      - name: Summarize verified scope
        if: success()
        shell: bash
        run: |
          {
            echo '## ChromascopeIP M11.5 Ubuntu CI'
            echo "- OS: ${{ matrix.os }}"
            echo '- OpenCV: 5.1.0 (source revision verified)'
            echo '- GUI + CLI: built in Release configuration'
            echo '- GUI-enabled build: full CTest suite passed'
            echo '- CLI-only build: full CTest suite passed'
            if [[ '${{ inputs.legacy_packages }}' == 'true' && '${{ matrix.os }}' == 'ubuntu-24.04' ]]; then
              echo '- Ubuntu 24.04: native .deb and isolated clean-install CLI smoke passed'
            fi
            if [[ '${{ inputs.legacy_packages }}' == 'true' && '${{ matrix.os }}' == 'ubuntu-26.04' ]]; then
              echo '- Ubuntu 26.04: native .deb and isolated clean-install CLI smoke passed'
            fi
            echo '- Historical v1.0.0 packaging: ${{ inputs.legacy_packages == true && 'enabled' || 'skipped on normal PR' }}'
            echo '- GUI launch, display interaction and webcam hardware: not tested in this workflow'
          } >> "$GITHUB_STEP_SUMMARY"
