# M1.6: Verify the core + CLI with MSVC 2022 on hosted Windows Server 2022.
# This is a Windows x64 CI build, NOT Windows 10/11 compatibility certification.
name: Windows CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  core-cli:
    name: windows-2022 / MSVC x64 / Release / CTest
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      OPENCV_EXPECTED_COMMIT: e4f78fbcf1a773fbed69e14500e8b734963eb585
      OPENCV_PREFIX: ${{ github.workspace }}\.ci-opencv\opencv-5.1.0

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail before the expensive native builds if a Windows checkout has
      # altered the byte-pinned legal notices (for example LF -> CRLF).
      - name: Verify pinned third-party notices before Windows build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -c "from scripts.third_party_notices import notice_payloads; print('Verified', len(notice_payloads()), 'pinned third-party notices')"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned legal notice preflight failed.' }

      - name: Confirm Windows x64 and MSVC 2022 toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_ARCH -ne 'X64') { throw 'Expected x64 runner.' }
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere)) { throw 'Visual Studio locator unavailable.' }
          $vs = & $vswhere -latest -products '*' -version '[17.0,18.0)' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'MSVC 2022 C++ toolchain is missing.' }
          Write-Host "Visual Studio 2022: $vs"
          cmake --version
          if ($LASTEXITCODE -ne 0) { throw 'CMake unavailable.' }

      - name: Restore isolated OpenCV 5.1.0 static installation
        id: opencv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ci-opencv/opencv-5.1.0
          # A new bootstrap implementation or toolchain requires a new key.
          key: opencv-5.1.0-win2022-msvc17-x64-static-md-dnn-proto-nopthread-${{ hashFiles('scripts/bootstrap_opencv_windows_x64.ps1', 'scripts/verify_opencv_windows_x64.ps1', 'scripts/opencv_windows_hooks/POST_DETECT_DEPENDENCIES.cmake', 'tests/quality/opencv_videoio_consumer/CMakeLists.txt', 'tests/integration/test_videoio_backend.cpp', 'tests/quality/opencv_videoio_consumer/dnn_probe.cpp') }}-m5-2-v1

      - name: Build OpenCV 5.1.0 from pinned source on cache miss
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          ./scripts/bootstrap_opencv_windows_x64.ps1 `
            -InstallPrefix $env:OPENCV_PREFIX `
            -BuildRoot (Join-Path $env:RUNNER_TEMP 'chromascope-opencv-build') `
            -Jobs 2

      - name: Verify cached/built OpenCV configuration and provenance
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stamp = Join-Path $env:OPENCV_PREFIX '.chromascope-opencv-windows-build.txt'
          if (-not (Test-Path -LiteralPath $stamp)) { throw 'OpenCV provenance marker missing.' }
          $data = Get-Content -LiteralPath $stamp -Raw
          $lines = $data -split '\r?\n'
          foreach ($field in @(
            "commit=$env:OPENCV_EXPECTED_COMMIT", 'opencv=5.1.0',
            'architecture=x64', 'toolchain=Visual Studio 17 2022',
            'configuration=Release', 'shared=OFF', 'static_crt=OFF',
            'modules=core,imgproc,imgcodecs,videoio,dnn', 'video_backend=msmf',
            'protobuf=ON', 'dnn_backend=opencv_cpu', 'windows_pthread_hook=ON', 'consumer_probe=PASS')) {
            if ($lines -notcontains $field) {
              throw "OpenCV provenance field mismatch: $field"
            }
          }
          # Select the actual MSVC 2022 x64 static package.
          # Do not select the top-level Windows Pack dispatcher.
          $opencvDir = Join-Path $env:OPENCV_PREFIX 'x64\vc17\staticlib'
          foreach ($filename in @(
            'OpenCVConfig.cmake',
            'OpenCVConfig-version.cmake',
            'OpenCVModules.cmake',
            'OpenCVModules-release.cmake'
          )) {
            $required = Join-Path $opencvDir $filename
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "OpenCV static package is incomplete: $required"
            }
          }
          "OpenCV_DIR=$opencvDir" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Verified OpenCV static package: $opencvDir"
          # Confirm imported CMake targets and static runtime libraries in a
          # separate real consumer; do this for both fresh builds and cache hits.
          ./scripts/verify_opencv_windows_x64.ps1 `
            -InstallPrefix $env:OPENCV_PREFIX `
            -ScratchRoot (Join-Path $env:RUNNER_TEMP 'chromascope-opencv-cached-probe') `
            -Jobs 2


      - name: Configure Windows CLI Release with pinned OpenCV
        shell: pwsh
        run: |
          cmake --preset windows-cli-release "-DOpenCV_DIR=$env:OpenCV_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'ChromascopeIP configure failed.' }

      - name: Build C++ core, CLI and test executables
        shell: pwsh
        run: |
          cmake --build --preset windows-cli-release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'ChromascopeIP build failed.' }

      - name: Run all registered Windows CTests
        shell: pwsh
        run: |
          ctest --preset windows-cli-release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Windows CTest failed.' }

      - name: Confirm CLI executable and GUI-out-of-scope boundary
        shell: pwsh
        run: |
          $cli = Join-Path $env:GITHUB_WORKSPACE 'build\presets\windows-cli-release\Release\chromascope-cli.exe'
          if (-not (Test-Path -LiteralPath $cli)) { throw 'CLI executable is missing.' }
          & $cli --version
          if ($LASTEXITCODE -ne 0) { throw 'CLI --version failed.' }
          $gui = Join-Path $env:GITHUB_WORKSPACE 'build\presets\windows-cli-release\Release\chromascope-gui.exe'
          if (Test-Path -LiteralPath $gui) { throw 'GUI target unexpectedly built in core/CLI-only CI.' }

      # M11.6: static GLFW 3.4 and Dear ImGui 1.93.0 GUI, alongside CLI.
      # Source identity is pinned to an immutable commit, not just a tag.
      - name: Build pinned static GLFW 3.4 for Windows GUI
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $source = Join-Path $env:RUNNER_TEMP 'chromascope-glfw-3.4-source'
          $build = Join-Path $env:RUNNER_TEMP 'chromascope-glfw-3.4-build'
          $prefix = Join-Path $env:RUNNER_TEMP 'chromascope-glfw-3.4-install'
          git clone --depth 1 --branch 3.4 -- https://github.com/glfw/glfw.git $source
          if ($LASTEXITCODE -ne 0) { throw 'GLFW source checkout failed.' }
          $actual = (& git -C $source rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $actual -ne '7b6aead9fb88b3623e3b3725ebb42670cbe4c579') {
            throw "GLFW 3.4 source commit mismatch: $actual"
          }
          cmake -S $source -B $build -G 'Visual Studio 17 2022' -A x64 `
            "-DCMAKE_INSTALL_PREFIX=$prefix" '-DBUILD_SHARED_LIBS=OFF' `
            '-DGLFW_BUILD_DOCS=OFF' '-DGLFW_BUILD_TESTS=OFF' `
            '-DGLFW_BUILD_EXAMPLES=OFF'
          if ($LASTEXITCODE -ne 0) { throw 'GLFW configure failed.' }
          cmake --build $build --config Release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'GLFW Release build failed.' }
          cmake --install $build --config Release
          if ($LASTEXITCODE -ne 0) { throw 'GLFW installation failed.' }
          $config = Join-Path $prefix 'lib/cmake/glfw3'
          if (-not (Test-Path -LiteralPath (Join-Path $config 'glfw3Config.cmake') -PathType Leaf)) {
            throw 'GLFW installed CMake package is missing.'
          }
          "glfw3_DIR=$config" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "CHROMASCOPE_GLFW_SOURCE=$source" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Configure Windows GUI and CLI Release
        shell: pwsh
        run: |
          cmake --preset windows-release "-DOpenCV_DIR=$env:OpenCV_DIR" "-Dglfw3_DIR=$env:glfw3_DIR"
          if ($LASTEXITCODE -ne 0) { throw 'Windows GUI/CLI configure failed.' }

      - name: Build Windows GUI and CLI Release
        shell: pwsh
        run: |
          cmake --build --preset windows-release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Windows GUI/CLI build failed.' }

      - name: Run all Windows GUI-enabled CTests
        shell: pwsh
        run: |
          ctest --preset windows-release --parallel 2
          if ($LASTEXITCODE -ne 0) { throw 'Windows GUI-enabled CTests failed.' }

      - name: Locate authenticated Microsoft VC143 x64 redistribution files
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vs = (& $vswhere -latest -products '*' -version '[17.0,18.0)' `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath).Trim()
          if ($LASTEXITCODE -ne 0 -or -not $vs) { throw 'VS2022 toolchain unavailable.' }
          $redist = Join-Path $vs 'VC/Redist/MSVC'
          $options = @(Get-ChildItem -LiteralPath $redist -Directory -ErrorAction Stop |
            Where-Object { $_.Name -match '^14\.' } | Sort-Object Name -Descending)
          $crt = $null
          foreach ($candidate in $options) {
            $folder = Join-Path $candidate.FullName 'x64/Microsoft.VC143.CRT'
            if (Test-Path -LiteralPath (Join-Path $folder 'vcruntime140.dll') -PathType Leaf) {
              $crt = $folder; break
            }
          }
          if (-not $crt) { throw 'VC143 x64 redistributable DLL directory missing.' }
          foreach ($name in @('vcruntime140.dll','msvcp140.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $crt $name) -PathType Leaf)) {
              throw "Required VC143 redistributable missing: $name"
            }
          }
          # The packager may require any of the source DLLs through PE imports.
          # Authenticate every redistributable in this vetted directory first.
          foreach ($dll in @(Get-ChildItem -LiteralPath $crt -File -Filter '*.dll')) {
            $signature = Get-AuthenticodeSignature -LiteralPath $dll.FullName
            if ($signature.Status -ne 'Valid' -or
                $signature.SignerCertificate.Subject -notmatch 'Microsoft') {
              throw "Unsigned or non-Microsoft VC143 redistributable: $($dll.Name)"
            }
          }
          "CHROMASCOPE_VC_REDIST_DIR=$crt" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and inspect portable Windows x64 ZIP candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/package_windows_x64.py --build `
            --build-dir build/presets/windows-release `
            --opencv-prefix $env:OPENCV_PREFIX `
            --vc-redist-dir $env:CHROMASCOPE_VC_REDIST_DIR `
            --glfw-license (Join-Path $env:CHROMASCOPE_GLFW_SOURCE 'LICENSE.md') `
            --imgui-license (Join-Path $env:GITHUB_WORKSPACE 'build/presets/windows-release/_deps/imgui-src/LICENSE.txt') `
            --output-dir build/packages
          if ($LASTEXITCODE -ne 0) { throw 'Windows ZIP build failed.' }
          python scripts/package_windows_x64.py --inspect `
            build/packages/ChromascopeIP-1.0.0-Windows-x64.zip
          if ($LASTEXITCODE -ne 0) { throw 'Windows ZIP inspection failed.' }

      - name: Smoke-test relocated portable Windows CLI without developer PATH
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $target = Join-Path $env:RUNNER_TEMP 'chromascope-m116-relocated'
          Expand-Archive -LiteralPath 'build/packages/ChromascopeIP-1.0.0-Windows-x64.zip' -DestinationPath $target
          $bin = Join-Path $target 'ChromascopeIP-1.0.0-Windows-x64/bin'
          $cli = Join-Path $bin 'chromascope-cli.exe'
          $gui = Join-Path $bin 'chromascope-gui.exe'
          if (-not (Test-Path -LiteralPath $gui -PathType Leaf)) { throw 'Portable GUI missing.' }
          # Prevent incidental OpenCV / MSVC development bin directories in PATH.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\Wbem"
          & $cli --version
          if ($LASTEXITCODE -ne 0) { throw 'Relocated CLI --version failed.' }
          & $cli --help
          if ($LASTEXITCODE -ne 0) { throw 'Relocated CLI --help failed.' }
          & $cli --list-profiles
          if ($LASTEXITCODE -ne 0) { throw 'Relocated CLI profiles failed.' }
          # Construct a fresh 2x2 BMP without historical samples or cameras.
          $bmp = Join-Path $target 'synthetic-smoke.bmp'
          $stream = [System.IO.File]::Create($bmp)
          try {
            $writer = [System.IO.BinaryWriter]::new($stream)
            $writer.Write([byte[]]@(0x42, 0x4D))
            $writer.Write([int]70)
            $writer.Write([int]0)
            $writer.Write([int]54)
            $writer.Write([int]40)
            $writer.Write([int]2)
            $writer.Write([int]2)
            $writer.Write([short]1)
            $writer.Write([short]24)
            $writer.Write([int]0)
            $writer.Write([int]16)
            $writer.Write([int]2835)
            $writer.Write([int]2835)
            $writer.Write([int]0)
            $writer.Write([int]0)
            $writer.Write([byte[]]@(10,20,30,40,50,60,0,0,
                                    70,80,90,100,110,120,0,0))
          } finally {
            if ($null -ne $writer) { $writer.Dispose() } else { $stream.Dispose() }
          }
          & $cli --input $bmp --profile grayscale --json -
          if ($LASTEXITCODE -ne 0) { throw 'Relocated CLI synthetic BMP processing failed.' }
          Write-Host 'PASS: relocated Windows CLI launched and processed a synthetic BMP without developer PATH.'
          # The interactive GUI needs later Windows 10/11 manual sign-off (M11.8).

      - name: Upload smoke-qualified Windows x64 ZIP candidate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ChromascopeIP-1.0.0-Windows-x64.zip
          path: build/packages/ChromascopeIP-1.0.0-Windows-x64.zip
          archive: false
          if-no-files-found: error
          retention-days: 7

      - name: Upload UNQUALIFIED Windows candidate for failure diagnosis
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: UNQUALIFIED-M11.6-Windows-x64-diagnostics
          path: build/packages/ChromascopeIP-1.0.0-Windows-x64.zip
          # Diagnostic artifacts MUST retain their UNQUALIFIED name:
          # archive:false would silently rename to the raw package filename.
          archive: true
          if-no-files-found: ignore
          retention-days: 2

      - name: Show CTest diagnostic logs on failure
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Path 'build/presets' -Recurse -Filter LastTest.log -ErrorAction SilentlyContinue | ForEach-Object {
            Write-Host "=== $($_.FullName) ==="
            Get-Content -LiteralPath $_.FullName -Tail 120
          }

      - name: Summarize verified Windows scope
        if: success()
        shell: pwsh
        run: |
          @(
            '## ChromascopeIP M11.6 Windows CI',
            '- Host: Windows Server 2022 x64, Visual Studio 2022 (MSVC)',
            '- OpenCV: 5.1.0, pinned source, static modules using dynamic MSVC CRT',
            '- C++ core, CLI, and test executables: built in Release configuration',
            '- CTest: all registered tests passed, including original JPEG fixtures and CLI export',
            '- Windows GUI compiled; ZIP includes CLI and GUI, app-local CRT DLLs, explicit PE dependency inventory',
            '- Relocated CLI startup smoke passed; interactive GUI and Windows 10/11 client compatibility remain unqualified'
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
