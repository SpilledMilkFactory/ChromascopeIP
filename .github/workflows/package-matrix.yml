# M11.7: all five packages must be built/tested from this SAME workflow run.
# Each job calls an existing native CI workflow at the same commit; no artifact
# is imported from an unrelated push, PR or earlier run.
name: Package Matrix CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: package-matrix-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  debian:
    name: Debian 12 + 13 native package qualification
    uses: ./.github/workflows/ci-debian.yml
    permissions:
      contents: read

  ubuntu:
    name: Ubuntu 24.04 + 26.04 native package qualification
    uses: ./.github/workflows/ci-ubuntu.yml
    permissions:
      contents: read

  windows:
    name: Windows x64 native package qualification
    uses: ./.github/workflows/ci-windows.yml
    permissions:
      contents: read

  validate:
    name: Validate all five artifacts from same run
    needs: [debian, ubuntu, windows]
    if: ${{ success() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install offline Debian package inspection tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev binutils patchelf

      # upload-artifact@v7 with archive:false IGNORES its name: input;
      # GitHub names each raw artifact after the uploaded file, INCLUDING
      # .deb/.zip. Select those actual names (not the extensionless stems),
      # preserve the unwrapped bytes and enforce SHA-256 digest verification.
      # A separate validated directory stem keeps the five inputs isolated.
      # No token, run-id override, pattern, or cross-run artifact lookup.
      - name: Download Debian 12 package from this run
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ChromascopeIP-0.1.3-Debian12-amd64.deb
          path: build/package-matrix/ChromascopeIP-0.1.3-Debian12-amd64
          skip-decompress: true

      - name: Download Debian 13 package from this run
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ChromascopeIP-0.1.3-Debian13-amd64.deb
          path: build/package-matrix/ChromascopeIP-0.1.3-Debian13-amd64
          skip-decompress: true

      - name: Download Ubuntu 24.04 package from this run
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ChromascopeIP-0.1.3-Ubuntu24.04-amd64.deb
          path: build/package-matrix/ChromascopeIP-0.1.3-Ubuntu24.04-amd64
          skip-decompress: true

      - name: Download Ubuntu 26.04 package from this run
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ChromascopeIP-0.1.3-Ubuntu26.04-amd64.deb
          path: build/package-matrix/ChromascopeIP-0.1.3-Ubuntu26.04-amd64
          skip-decompress: true

      - name: Download Windows x64 package from this run
        uses: actions/download-artifact@70fc10c6e5e1ce46ad2ea6f2b72d43f7d47b13c3 # v8.0.0
        with:
          name: ChromascopeIP-0.1.3-Windows-x64.zip
          path: build/package-matrix/ChromascopeIP-0.1.3-Windows-x64
          skip-decompress: true

      - name: Validate package matrix and create provenance report
        env:
          MATRIX_RUN_ID: ${{ github.run_id }}
          MATRIX_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          python3 scripts/validate_package_matrix.py \
            --artifacts-dir build/package-matrix \
            --report build/package-matrix-report.json \
            --run-id "$MATRIX_RUN_ID" \
            --commit "$MATRIX_COMMIT"

      - name: Upload qualified matrix validation report (not a release)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ChromascopeIP-0.1.3-M11.7-Matrix-Report
          path: build/package-matrix-report.json
          # Report is archived so the displayed artifact name is the reviewed
          # matrix-report identity (raw archive:false ignores name).
          archive: true
          if-no-files-found: error
          retention-days: 7

      # M11.9 drafts are *evidence*, not a legal/redistribution PASS.
      # Full manual notices, codec, toolchain, and patent review remains open.
      - name: Generate offline M11.9 artifact-derived SBOM drafts
        run: |
          set -Eeuo pipefail
          python3 scripts/audit_redistribution_m119.py \
            --artifacts-dir build/package-matrix \
            --matrix-report build/package-matrix-report.json \
            --output-dir build/redistribution-m119

      - name: Upload M11.9 review-required SBOM evidence (not clearance)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ChromascopeIP-0.1.3-M11.9-SBOM-Drafts-REVIEW-REQUIRED
          path: build/redistribution-m119/
          archive: true
          if-no-files-found: error
          retention-days: 7

      - name: Summarize matrix-only qualification
        run: |
          {
            echo '## M11.7 — complete package matrix verified'
            echo '- All five OS-specific packages came from this single GitHub Actions run.'
            echo '- Reused each platform’s native compilation, CTest, package inspection and clean/relocated smoke gates.'
            echo '- Independently re-inspected all five downloaded artifacts and wrote a SHA-256/run/commit report.'
            echo '- This is NOT Windows 10/11 GUI certification, hardware qualification, signing or a public release.'
          } >> "$GITHUB_STEP_SUMMARY"
