# M1.7: first-party diagnostics, sanitizers, and pinned-action policy.
# This complements, rather than replaces, the five accepted OS CI checks.
name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  diagnostics:
    name: ubuntu-24.04 / First-party ASan UBSan clang-tidy
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    env:
      OPENCV_EXPECTED_COMMIT: e4f78fbcf1a773fbed69e14500e8b734963eb585
      OPENCV_BUILD_JOBS: '2'
      DEBIAN_FRONTEND: noninteractive
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Validate CI policy and its negative regressions
        run: |
          python3 scripts/check_ci_policy.py
          python3 scripts/check_provenance.py
          python3 -m unittest discover -s tests/quality -p 'test_*.py' -v

      - name: Install compiler and analysis dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build git pkg-config python3 clang-tidy-18 \
            libjpeg-dev libpng-dev libtiff-dev libwebp-dev
          clang-tidy-18 --version

      - name: Restore isolated OpenCV 5.1.0
        id: opencv-cache
        uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ~/.local/opt/opencv-5.1.0
          key: opencv-5.1.0-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('scripts/bootstrap_opencv_ubuntu_26_04.sh') }}-v1

      - name: Build OpenCV on cache miss
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: ./scripts/bootstrap_opencv_ubuntu_26_04.sh

      - name: Verify OpenCV provenance
        run: |
          set -Eeuo pipefail
          prefix="$HOME/.local/opt/opencv-5.1.0"
          test -f "$prefix/.chromascope-opencv-source-revision"
          test "$(cat "$prefix/.chromascope-opencv-source-revision")" = "$OPENCV_EXPECTED_COMMIT"
          test -f "$prefix/lib/cmake/opencv5/OpenCVConfig.cmake"

      - name: Configure CLI Release with warnings as errors
        run: cmake --preset linux-cli-release -DCHROMASCOPE_WARNINGS_AS_ERRORS=ON

      - name: Build CLI Release and first-party tests
        run: cmake --build --preset linux-cli-release --parallel 2

      - name: Verify CLI Release CTests
        run: ctest --preset linux-cli-release --parallel 2

      - name: Run clang-tidy 18 against first-party compilation units
        run: python3 scripts/run_clang_tidy.py --build-dir build/presets/linux-cli-release

      - name: Configure ASan and UBSan Debug build
        run: cmake --preset linux-cli-sanitize

      - name: Build ASan and UBSan Debug targets
        run: cmake --build --preset linux-cli-sanitize --parallel 2

      - name: Run all eleven CTests with ASan and UBSan
        run: ctest --preset linux-cli-sanitize --parallel 1

      - name: Show CTest logs on failure
        if: failure()
        run: |
          find build/presets -path '*/Testing/Temporary/LastTest.log' \
            -type f -print -exec tail -n 120 {} \; || true

      - name: Summarize validated scope
        if: success()
        run: |
          {
            echo '## ChromascopeIP M1.7 quality gate'
            echo '- Ubuntu 24.04, GCC first-party warnings-as-errors'
            echo '- Clang-tidy 18 correctness checks for core/CLI/test units'
            echo '- ASan + UBSan Debug CLI-only; full eleven-test CTest suite'
            echo '- ASan + UBSan Debug CLI-only; full nine-test CTest suite'
            echo '- Workflow policy and historical fixture provenance integrity (media rights unresolved)'
            echo '- GUI runtime, third-party instrumentation and Windows sanitizers: not checked'
          } >> "$GITHUB_STEP_SUMMARY"
