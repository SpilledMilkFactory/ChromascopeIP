# M12.6: same-run release staging and signed attestations (NOT publication).
# Manual main-branch only. Does not create/push a Git tag or a GitHub Release.
name: Release Staging CI

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-staging-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rc:
    name: Complete exact-source RC qualification
    if: ${{ github.ref == 'refs/heads/main' }}
    uses: ./.github/workflows/release-candidate.yml
    permissions:
      contents: read

  stage:
    name: Stage checksums, SBOM and signed build provenance
    needs: [rc]
    if: ${{ github.ref == 'refs/heads/main' && needs.rc.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out exact main-branch source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Debian package validation tools
        run: |
          set -Eeuo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dpkg-dev binutils patchelf
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python3 scripts/check_release_m121.py

      # Raw v7 artifacts use their actual filenames, including extension.
      - name: Download Debian 12 candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ChromascopeIP-1.0.0-Debian12-amd64.deb
          path: build/m126-input/ChromascopeIP-1.0.0-Debian12-amd64
          skip-decompress: true

      - name: Download Debian 13 candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ChromascopeIP-1.0.0-Debian13-amd64.deb
          path: build/m126-input/ChromascopeIP-1.0.0-Debian13-amd64
          skip-decompress: true

      - name: Download Ubuntu 24.04 candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ChromascopeIP-1.0.0-Ubuntu24.04-amd64.deb
          path: build/m126-input/ChromascopeIP-1.0.0-Ubuntu24.04-amd64
          skip-decompress: true

      - name: Download Ubuntu 26.04 candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ChromascopeIP-1.0.0-Ubuntu26.04-amd64.deb
          path: build/m126-input/ChromascopeIP-1.0.0-Ubuntu26.04-amd64
          skip-decompress: true

      - name: Download Windows x64 candidate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ChromascopeIP-1.0.0-Windows-x64.zip
          path: build/m126-input/ChromascopeIP-1.0.0-Windows-x64
          skip-decompress: true

      - name: Download same-run package matrix report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ChromascopeIP-1.0.0-M11.7-Matrix-Report
          path: build/m126-reports/matrix

      - name: Download same-run M11.9 SBOM drafts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ChromascopeIP-1.0.0-M11.9-SBOM-Drafts-REVIEW-REQUIRED
          path: build/m126-reports/sbom

      - name: Download same-run M12.2 RC report
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ChromascopeIP-1.0.0-M12.2-RC-Automated-Evidence
          path: build/m126-reports/rc

      - name: Independently stage and hash exact-source release assets
        env:
          CANDIDATE_COMMIT: ${{ github.sha }}
          CANDIDATE_RUN: ${{ github.run_id }}
        run: |
          set -Eeuo pipefail
          python3 scripts/stage_release_m126.py --stage \
            --artifacts-dir build/m126-input \
            --matrix-report build/m126-reports/matrix/package-matrix-report.json \
            --sbom-dir build/m126-reports/sbom \
            --rc-report build/m126-reports/rc/m122-rc-report.json \
            --output-dir build/m126-staged \
            --commit "$CANDIDATE_COMMIT" --run-id "$CANDIDATE_RUN"
          python3 scripts/stage_release_m126.py --verify-stage build/m126-staged
          (cd build/m126-staged && sha256sum --check SHA256SUMS)

      # The offline staging verifier checks all five CycloneDX serial numbers,
      # source identities, hashes, and required actions/attest detection fields
      # BEFORE any provenance or SBOM attestation is generated.
      - name: Generate Sigstore-signed provenance for five package assets
        id: provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            build/m126-staged/ChromascopeIP-1.0.0-Debian12-amd64.deb
            build/m126-staged/ChromascopeIP-1.0.0-Debian13-amd64.deb
            build/m126-staged/ChromascopeIP-1.0.0-Ubuntu24.04-amd64.deb
            build/m126-staged/ChromascopeIP-1.0.0-Ubuntu26.04-amd64.deb
            build/m126-staged/ChromascopeIP-1.0.0-Windows-x64.zip

      - name: Sign Debian 12 CycloneDX SBOM attestation
        id: sbom_deb12
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/m126-staged/ChromascopeIP-1.0.0-Debian12-amd64.deb
          sbom-path: build/m126-staged/ChromascopeIP-Debian12-amd64.cdx.json

      - name: Sign Debian 13 CycloneDX SBOM attestation
        id: sbom_deb13
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/m126-staged/ChromascopeIP-1.0.0-Debian13-amd64.deb
          sbom-path: build/m126-staged/ChromascopeIP-Debian13-amd64.cdx.json

      - name: Sign Ubuntu 24.04 CycloneDX SBOM attestation
        id: sbom_ubuntu24
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/m126-staged/ChromascopeIP-1.0.0-Ubuntu24.04-amd64.deb
          sbom-path: build/m126-staged/ChromascopeIP-Ubuntu24.04-amd64.cdx.json

      - name: Sign Ubuntu 26.04 CycloneDX SBOM attestation
        id: sbom_ubuntu26
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/m126-staged/ChromascopeIP-1.0.0-Ubuntu26.04-amd64.deb
          sbom-path: build/m126-staged/ChromascopeIP-Ubuntu26.04-amd64.cdx.json

      - name: Sign Windows x64 CycloneDX SBOM attestation
        id: sbom_windows
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: build/m126-staged/ChromascopeIP-1.0.0-Windows-x64.zip
          sbom-path: build/m126-staged/ChromascopeIP-Windows-x64.cdx.json

      - name: Preserve signed Sigstore attestation bundles
        env:
          PROVENANCE_BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
          DEB12_BUNDLE: ${{ steps.sbom_deb12.outputs.bundle-path }}
          DEB13_BUNDLE: ${{ steps.sbom_deb13.outputs.bundle-path }}
          UBUNTU24_BUNDLE: ${{ steps.sbom_ubuntu24.outputs.bundle-path }}
          UBUNTU26_BUNDLE: ${{ steps.sbom_ubuntu26.outputs.bundle-path }}
          WINDOWS_BUNDLE: ${{ steps.sbom_windows.outputs.bundle-path }}
        run: |
          set -Eeuo pipefail
          mkdir -p build/m126-signed-attestations
          cp "$PROVENANCE_BUNDLE" build/m126-signed-attestations/build-provenance.sigstore.json
          cp "$DEB12_BUNDLE" build/m126-signed-attestations/debian12-sbom.sigstore.json
          cp "$DEB13_BUNDLE" build/m126-signed-attestations/debian13-sbom.sigstore.json
          cp "$UBUNTU24_BUNDLE" build/m126-signed-attestations/ubuntu24-sbom.sigstore.json
          cp "$UBUNTU26_BUNDLE" build/m126-signed-attestations/ubuntu26-sbom.sigstore.json
          cp "$WINDOWS_BUNDLE" build/m126-signed-attestations/windows-sbom.sigstore.json
          test "$(find build/m126-signed-attestations -type f | wc -l)" -eq 6

      - name: Upload exact-source release staging bundle (NOT PUBLIC RELEASE)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ChromascopeIP-1.0.0-M12.6-STAGED-NOT-RELEASED
          path: build/m126-staged/
          archive: true
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed attestation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ChromascopeIP-1.0.0-M12.6-SIGNED-ATTESTATIONS
          path: build/m126-signed-attestations/
          archive: true
          if-no-files-found: error
          retention-days: 14

      - name: Summarize staging boundaries
        run: |
          {
            echo '## M12.6 — five v1.0.0 packages staged and attested'
            echo '- Verified SHA256SUMS, five CycloneDX inventories and M11.7/M12.2 evidence from THIS run.'
            echo '- Sigstore-signed provenance and five CycloneDX SBOM attestations issued by GitHub Actions.'
            echo '- Tag proposal: v1.0.0. No tag, release, or publication created.'
            echo '- **NOT RELEASE-AUTHORIZED**: M11.9 license topics and M12.5 vulnerability findings remain open.'
          } >> "$GITHUB_STEP_SUMMARY"
